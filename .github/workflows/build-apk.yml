name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: ./android
        run: |
          curl -sLO "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          unzip -q "gradle-8.11.1-bin.zip"
          GRADLE_HOME="$PWD/gradle-8.11.1"
          $GRADLE_HOME/bin/gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
