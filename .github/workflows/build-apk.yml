name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Gradle
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          unzip -q "gradle-8.10.2-bin.zip"
          echo "${PWD}/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build APK
        id: build
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Show errors
        if: failure()
        run: grep -A5 "error:\|FAILED\|Exception" gradle.log || echo "No matching patterns found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
