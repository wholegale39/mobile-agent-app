name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Gradle
        run: |
          curl -sLO "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          unzip -q "gradle-8.11.1-bin.zip"
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-app-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Debug - List files
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
