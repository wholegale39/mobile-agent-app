name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Gradle
        run: |
          curl -sLO "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          unzip -q "gradle-8.11.1-bin.zip"
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build APK
        id: build
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          echo "EXIT_CODE=$?" >> $GITHUB_OUTPUT

      - name: Show errors
        if: always()
        run: |
          echo "=== BUILD LOG ==="
          grep -E "error:|FAILED|BUILD FAILED|What went wrong|Exception" /tmp/build.log || echo "No error patterns found"
          echo "=== LAST 20 LINES ==="
          tail -20 /tmp/build.log

      - name: Upload APK
        if: steps.build.outputs.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: agent-app-debug
          path: android/**/*.apk
